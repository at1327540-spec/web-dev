<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-align: center;
            text-transform: capitalize;
        }
        p{
            font-family: 'Times New Roman'
        }
        #outer{
            font-size: 10px;
        }
        #inner{
            font-size: 25px;
        }
    </style>
</head>
<body>
    <h1>this heading tag</h1>
    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolor illum quis voluptatibus 
        cupiditate eligendi odio nostrum modi laudantium quam quos obcaecati nulla quo, nihil ex, 
        similique deserunt dignissimos, sed ratione?
    </p>
    <div id="outer">
        <p>outer</p>
        <div id="inner">
            <p>inner</p>
        </div>
    </div>
</body>
</html>
